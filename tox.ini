[tox]
isolated_build = True

envlist =
    py{3.10,3.11,3.12,3.13}-django4.2{,-importexport}
    py{3.10,3.11,3.12,3.13}-django5.0{,-importexport}

[testenv]
setenv =
    PYTHONPATH={toxinidir}
deps =
    django4.2: Django>=4.2,<5.0
    django5.0: Django>=5.0,<6.0
    importexport: django-import-export
    pytest
    pytest-ruff
commands =
    pytest
